{% extends "core/base.html" %}
{% block title %}Upload CSV — FSC{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white fw-semibold">
        <i class="bi bi-cloud-upload me-2"></i>Upload New Data
      </div>
      <div class="card-body">
        <p class="text-muted small">
          Upload the latest SUP2 CSV export from HMIS. The dashboard will reload
          automatically using the new file.
        </p>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">CSV File</label>
            <input type="file" name="csv_file" accept=".csv" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-upload me-2"></i>Upload &amp; Reload
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
