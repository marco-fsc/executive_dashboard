<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FSC Dashboard{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --fsc-green:        #1e5128;  /* forest green */
      --fsc-green-mid:    #2d7a3a;
      --fsc-green-light:  #e8f5e9;
      --fsc-yellow:       #f5e642;  /* easter egg yellow */
      --fsc-yellow-dark:  #c9bb00;
    }

    body { background-color: #f4f7f4; font-size: 0.9rem; }

    /* ── Navbar ──────────────────────────────────────── */
    .navbar { background-color: var(--fsc-green) !important; }
    .navbar-brand, .nav-link { color: var(--fsc-yellow) !important; }
    .nav-link:hover, .nav-link.active { color: #fff !important; }
    .btn-warning { background-color: var(--fsc-yellow); border-color: var(--fsc-yellow-dark); color: #1e5128; font-weight: 700; }
    .btn-warning:hover { background-color: var(--fsc-yellow-dark); border-color: var(--fsc-yellow-dark); color: #fff; }

    .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }

    /* ── KPI cards ───────────────────────────────────── */
    .kpi-card {
      border-left: 4px solid var(--fsc-green-mid);
      border-radius: 6px;
      background: #fff;
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .kpi-card.danger  { border-left-color: #dc3545; }
    .kpi-card.warning { border-left-color: #c9bb00; }
    .kpi-card.success { border-left-color: var(--fsc-green-mid); }

    .kpi-value { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
    .kpi-label { font-size: 0.78rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Badges ──────────────────────────────────────── */
    .badge-MentalHealth     { background: #6610f2; }
    .badge-SubstanceUse     { background: #dc3545; }
    .badge-ChronicHealth    { background: #fd7e14; }
    .badge-Developmental    { background: #0dcaf0; color: #000; }
    .badge-PoorHealth       { background: #6c757d; }
    .badge-NoServices       { background: #343a40; }
    .badge-NoRecentContact  { background: var(--fsc-yellow); color: #1e5128; }
    .badge-LongStay         { background: var(--fsc-green-mid); }

    .risk-High   { color: #dc3545; font-weight: 700; }
    .risk-Medium { color: #fd7e14; font-weight: 600; }
    .risk-Low    { color: var(--fsc-green-mid); }

    .chart-container { position: relative; height: 280px; }
    .table-hover tbody tr:hover { background-color: var(--fsc-green-light); }
    .sidebar-filter label { font-size: 0.82rem; color: #495057; }

    /* ── Drillable KPI cards ─────────────────────────────────────────────── */
    .kpi-drillable { cursor: pointer; transition: box-shadow .15s, transform .12s; }
    .kpi-drillable:hover { box-shadow: 0 4px 14px rgba(30,81,40,.25); transform: translateY(-1px); }
    a:has(.kpi-drillable):hover .kpi-label { text-decoration: underline; }

    /* ── Service tiles ───────────────────────────────────────────────────── */
    .svc-tile {
      border: 1px solid #dee2e6;
      border-left: 4px solid #1e5128;
      border-radius: 8px;
      padding: 12px 14px;
      background: #fff;
      text-align: center;
    }
    .svc-tile .svc-count {
      font-size: 1.65rem;
      font-weight: 700;
      color: #1e5128;
      line-height: 1.1;
    }
    .svc-tile .svc-name {
      font-size: 0.73rem;
      color: #6c757d;
      line-height: 1.35;
      margin-top: 4px;
    }

    /* ── Card headers / table-dark ───────────────────── */
    .table-dark { background-color: var(--fsc-green) !important; }
    .table-dark th { background-color: var(--fsc-green) !important; color: var(--fsc-yellow) !important; }

    /* ── Modal header ────────────────────────────────── */
    .modal-header { background-color: var(--fsc-green) !important; color: var(--fsc-yellow) !important; }
    .modal-header .btn-close { filter: invert(1); }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg px-3 mb-4">
  <a class="navbar-brand" href="{% url 'executive_dashboard' %}">
    <i class="bi bi-house-heart-fill me-2"></i>FSC Performance
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <li class="nav-item">
        <a class="nav-link {% block nav_exec %}{% endblock %}" href="{% url 'executive_dashboard' %}">
          <i class="bi bi-speedometer2 me-1"></i>Executive
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_sup %}{% endblock %}" href="{% url 'supervisor_dashboard' %}">
          <i class="bi bi-people-fill me-1"></i>Supervisor
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% block nav_clients %}{% endblock %}" href="{% url 'client_list' %}">
          <i class="bi bi-person-lines-fill me-1"></i>Clients
        </a>
      </li>
    </ul>
    <div class="d-flex gap-2">
      <!-- Report download button -->
      <button class="btn btn-sm btn-warning fw-semibold" data-bs-toggle="modal" data-bs-target="#reportModal">
        <i class="bi bi-file-earmark-bar-graph-fill me-1"></i>Download Report
      </button>
      <a href="{% url 'upload_csv' %}" class="btn btn-outline-light btn-sm">
        <i class="bi bi-cloud-upload me-1"></i>Upload CSV
      </a>
    </div>
  </div>
</nav>

<!-- ── Report Download Modal ────────────────────────────────────────────── -->
<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header" style="background:#228B22; color:#fff;">
        <h6 class="modal-title fw-bold" id="reportModalLabel">
          <i class="bi bi-file-earmark-bar-graph-fill me-1"></i>Executive Outcomes Report
        </h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">Select an optional date range, then download. Leave blank for all-time data.</p>
        <div class="mb-2">
          <label for="reportStart" class="form-label small fw-semibold">Start Date</label>
          <input type="date" id="reportStart" class="form-control form-control-sm">
        </div>
        <div class="mb-3">
          <label for="reportEnd" class="form-label small fw-semibold">End Date</label>
          <input type="date" id="reportEnd" class="form-control form-control-sm">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-semibold">Format</label>
          <div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="reportFmt" id="fmtPdf" value="pdf" checked>
              <label class="form-check-label small" for="fmtPdf">PDF</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="reportFmt" id="fmtPng" value="png">
              <label class="form-check-label small" for="fmtPng">PNG</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm fw-semibold" id="reportDownloadBtn"
                style="background:#228B22; color:#fff;" onclick="triggerReportDownload()">
          <i class="bi bi-download me-1"></i>Download
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function triggerReportDownload() {
  const start  = document.getElementById('reportStart').value;
  const end    = document.getElementById('reportEnd').value;
  const fmt    = document.querySelector('input[name="reportFmt"]:checked').value;
  const params = new URLSearchParams();
  if (start) params.set('start_date', start);
  if (end)   params.set('end_date',   end);
  if (fmt)   params.set('format',     fmt);
  const url = '{% url "report" %}' + (params.toString() ? '?' + params.toString() : '');
  window.location.href = url;
}
</script>

<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
